server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # max body — Bild-Uploads kommen als JSON (base64), max ~10 MB
    client_max_body_size 12m;

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Wichtig für SSE (Server-Sent Events / Echtzeit-Feed)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Uploads → Backend.
    # ^~ erzwingt prefix-match VOR der regex-location für statische Assets,
    # sonst würde .jpg/.png lokal gesucht werden und 404 zurückgeben.
    location ^~ /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Static frontend assets (Vite-Build)
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}